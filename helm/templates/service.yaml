apiVersion: v1
kind: Service
metadata:
  name: {{ include "simpleshop.name" . }}
  labels:
    {{- include "simpleshop.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "simpleshop.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP
