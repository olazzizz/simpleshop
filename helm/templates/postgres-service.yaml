{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simpleshop.postgresName" . }}
  labels:
    {{- include "simpleshop.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "simpleshop.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
{{- end }}
