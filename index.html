<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleShop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a class="logo" href="#">SimpleShop</a>
      <div class="header-actions">
        <button class="wishlist-header-btn" id="wishlistBtn" aria-label="View wishlist">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span class="wishlist-count" id="wishlistCount">0</span>
        </button>
        <button class="cart-btn" id="cartBtn" aria-label="Open cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Fresh picks, delivered fast.</h1>
      <p>Quality products curated just for you.</p>
    </section>

    <section class="category-bar">
      <div class="category-pills" id="categoryPills"></div>
    </section>

    <section class="controls">
      <div class="control-group">
        <input type="text" id="searchInput" class="search-input" placeholder="Search products..." />
      </div>
      <div class="control-group">
        <select id="categoryFilter" class="filter-select">
          <option value="">All Categories</option>
        </select>
        <select id="priceFilter" class="filter-select">
          <option value="">All Prices</option>
          <option value="0-50">Under $50</option>
          <option value="50-150">$50 - $150</option>
          <option value="150-999">$150+</option>
        </select>
        <select id="sortSelect" class="filter-select">
          <option value="popular">Most Popular</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </section>

    <section class="products" id="products">
      <!-- injected by JS -->
    </section>
  </main>

  <!-- Wishlist drawer -->
  <div class="overlay" id="wishlistOverlay"></div>
  <aside class="wishlist-drawer" id="wishlistDrawer">
    <div class="wishlist-header">
      <h2>My Wishlist</h2>
      <button class="close-btn" id="closeWishlist" aria-label="Close wishlist">&times;</button>
    </div>
    <ul class="wishlist-items" id="wishlistItems"></ul>
    <p class="wishlist-empty" id="wishlistEmpty">Your wishlist is empty. Add items to get started!</p>
  </aside>

  <!-- Product detail modal -->
  <div class="overlay" id="modalOverlay"></div>
  <div class="product-modal" id="productModal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <!-- Cart drawer -->
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-btn" id="closeCart" aria-label="Close cart">&times;</button>
    </div>
    <ul class="cart-items" id="cartItems"></ul>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total">
        <div>Subtotal: <strong id="cartSubtotal">$0.00</strong></div>
        <div style="margin-top:8px; font-size:.9rem; color:#666;">Shipping: Free on orders over $50</div>
        <div style="margin-top:12px; border-top:1px solid #eee; padding-top:12px;">
          Total: <strong style="font-size:1.3rem;" id="cartTotal">$0.00</strong>
        </div>
      </div>
      <button class="checkout-btn">Checkout</button>
    </div>
    <p class="cart-empty" id="cartEmpty">Your cart is empty.</p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
